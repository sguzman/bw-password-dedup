name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
      - name: Reject tracked secret-export artifacts
        run: bash ci/release-privacy.sh
      - name: Preview Rust formatting
        run: |
          cargo +stable fmt --all
          git diff --no-color --unified=0 -- src/bundle.rs src/main.rs
      - name: Lint all targets
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Check compilation
        run: cargo +stable check --locked --all-targets
      - name: Run tests
        run: cargo +stable test --locked --all-targets

