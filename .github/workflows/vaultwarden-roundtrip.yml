name: Isolated Vaultwarden JSON Round Trip

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ci/vaultwarden-roundtrip.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vaultwarden-roundtrip.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'ci/vaultwarden-roundtrip.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vaultwarden-roundtrip.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaultwarden-roundtrip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vaultwarden:
    name: Docker Vaultwarden and native Bitwarden CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deduplicator
        uses: actions/checkout@v4
      - name: Checkout pinned MIT-licensed Bitwarden bootstrap primitives
        uses: actions/checkout@v4
        with:
          repository: wererootops/zero-touch-trust-none
          ref: edc50b3f6c2044982acb26d5142d2a8ef5f33910
          path: ci/bootstrap-crypto
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build deduplicator
        run: cargo +stable build --locked
      - name: Download pinned official Bitwarden GPL CLI and verify SHA256
        run: |
          set -euo pipefail
          mkdir -p ci/bw-cli
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/bitwarden/clients/releases/download/cli-v2026.9.1/bw-oss-linux-2026.9.1.zip' \
            -o ci/bw-cli/cli.zip
          echo 'b90c0fc86bcf11c0b194aa3f0a89344738af0512cb267c39ad3250c5edd71663  ci/bw-cli/cli.zip' | sha256sum -c -
          unzip -q ci/bw-cli/cli.zip -d ci/bw-cli
          test -f ci/bw-cli/bw
          chmod 700 ci/bw-cli/bw
      - name: Start fully isolated Vaultwarden over localhost HTTPS
        run: |
          set -euo pipefail
          echo "VW_TEST_ROOT=$(mktemp -d)" >> "$GITHUB_ENV"
          # This directory is used only in this ephemeral CI runner. Never
          # mount a real host vault or expose a service on non-loopback IPs.
          mkdir -p "$RUNNER_TEMP/vw-fixture"/{data,tls}
          chmod 700 "$RUNNER_TEMP/vw-fixture" "$RUNNER_TEMP/vw-fixture/data" "$RUNNER_TEMP/vw-fixture/tls"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout "$RUNNER_TEMP/vw-fixture/tls/key.pem" \
            -out "$RUNNER_TEMP/vw-fixture/tls/cert.pem" \
            -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' > /dev/null 2>&1
          docker run -d --name dedup-vaultwarden-ci \
            -p 127.0.0.1:8443:80 \
            -v "$RUNNER_TEMP/vw-fixture/data:/data" \
            -v "$RUNNER_TEMP/vw-fixture/tls:/ssl:ro" \
            -e DOMAIN=https://127.0.0.1:8443 \
            -e SIGNUPS_ALLOWED=true \
            -e SIGNUPS_VERIFY=false \
            -e 'ROCKET_TLS={certs="/ssl/cert.pem",key="/ssl/key.pem"}' \
            vaultwarden/server:1.37.4 > /dev/null
          for attempt in $(seq 1 50); do
            if curl -fsS --cacert "$RUNNER_TEMP/vw-fixture/tls/cert.pem" \
              'https://127.0.0.1:8443/alive' > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Temporary Vaultwarden did not become healthy' >&2
          exit 1
      - name: Verify synthetic import, decrypted export and repeat-import behavior
        run: |
          set -euo pipefail
          bash ci/vaultwarden-roundtrip.sh \
            "$PWD/target/debug/bw-passport-dedup" \
            "$PWD/ci/bw-cli/bw" \
            "$PWD/ci/bootstrap-crypto/vaultwarden/lib/bitwarden-crypto.sh" \
            "$RUNNER_TEMP/vw-fixture"
      - name: Destroy isolated server and test data
        if: always()
        run: |
          docker rm --force --volumes dedup-vaultwarden-ci >/dev/null 2>&1 || true
          if [ -d "$RUNNER_TEMP/vw-fixture" ]; then
            rm -rf -- "$RUNNER_TEMP/vw-fixture"
          fi
          rm -rf -- ci/bw-cli ci/bootstrap-crypto
